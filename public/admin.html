<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>自定义域名管理后台</title>
    <link rel="stylesheet" href="/index.css?v=classic-20261105" />
    <link rel="icon" href="/logo.svg" />
  </head>
  <body class="admin-page">
    <main>
      <header class="admin-header">
        <div>
          <h1>🛠️ 自定义域名管理后台</h1>
          <p>管理和配置自定义域名，优化访问性能</p>
          <p id="identity" class="user-pill"></p>
        </div>
        <div class="header-actions">
          <a class="button" href="/">查看首页</a>
          <form action="/admin/logout" method="post">
            <button class="danger">退出登录</button>
          </form>
        </div>
      </header>
      <p id="message" role="status"></p>
      <section class="panel">
        <div class="section-title">
          <h2>刷新任务</h2>
          <button id="refresh" class="accent">刷新自动域名</button>
        </div>
        <p id="job">正在读取任务状态…</p>
        <progress id="progress" max="1" value="0"></progress>
        <p id="errors" class="error"></p>
        <p class="notice">
          手动固定项与停用项不会被刷新覆盖。本地测速会另行提交 HTTPS 验证结果。
        </p>
      </section>
      <section class="panel">
        <h2>添加域名</h2>
        <form id="add" class="form-row">
          <div>
            <label for="domain">域名</label
            ><input
              id="domain"
              name="domain"
              placeholder="example.com"
              required
            />
          </div>
          <div>
            <label for="ip">固定 IP（可选）</label
            ><input id="ip" name="ip" placeholder="手动模式需填写" />
          </div>
          <div>
            <label for="mode">更新模式</label
            ><select id="mode" name="mode">
              <option value="manual">手动固定</option>
              <option value="dns">自动解析</option>
              <option value="probe">本地测速</option>
            </select>
          </div>
          <button type="submit">添加或更新</button>
        </form>
      </section>
      <section class="panel">
        <div class="section-title">
          <h2>自定义域名</h2>
          <a class="button" href="/api/custom-domains/export">导出完整备份</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>域名 / 最近状态</th>
                <th>当前 IP</th>
                <th>模式</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="domains"></tbody>
          </table>
        </div>
      </section>
      <details class="panel">
        <summary>内置 GitHub 域名与本地验证结果</summary>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>域名 / 状态</th>
                <th>当前 IP / 验证</th>
              </tr>
            </thead>
            <tbody id="github"></tbody>
          </table>
        </div>
      </details>
      <section class="controls">
        <div class="panel">
          <h2>批量添加 / 导入</h2>
          <p class="notice">
            每行一个域名，或“IP 空格 域名”。导出的 JSON 可恢复自定义域名。
          </p>
          <textarea id="batch" rows="5" aria-label="批量域名"></textarea>
          <div class="inline">
            <button id="batchAdd">添加以上记录</button
            ><label for="import">选择备份文件</label
            ><input id="import" type="file" accept="application/json" />
          </div>
        </div>
        <div class="panel">
          <h2>恢复最近配置</h2>
          <p class="notice">
            保留最近 10 次变更前的配置，恢复前会再保存当前版本。
          </p>
          <label for="backup">选择版本</label
          ><select id="backup"></select>
          <p><button id="restore">恢复所选配置</button></p>
          <p id="publication" class="error"></p>
        </div>
      </section>
      <footer>
        <span id="version"></span><a href="/">查看公开下载页 ↗</a>
      </footer>
    </main>
    <script src="/admin.js" defer></script>
  </body>
</html>
