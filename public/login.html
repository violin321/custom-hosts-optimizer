<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录管理后台</title>
    <link rel="stylesheet" href="/index.css?v=classic-20261105" />
    <link rel="icon" href="/logo.svg" />
  </head>
  <body class="login-page">
    <main>
      <section class="login">
        <h1>管理后台登录</h1>
        <form id="login">
          <label for="username">用户名</label>
          <input
            id="username"
            name="username"
            autocomplete="username"
            required
            autofocus
          />
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p id="message" role="status"></p>
          <button type="submit">登录</button>
        </form>
        <p class="notice">会话有效期 24 小时。账号与 Cloudflare 账号独立。</p>
        <a href="/">返回首页</a>
      </section>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
