name = "custom-hosts-optimizer"
main = "src/index.ts"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "hosts.violin47.dpdns.org", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[kv_namespaces]]
binding = "custom_hosts"
id = "YOUR_KV_NAMESPACE_ID"

[durable_objects.code_update_strategy]
mode = "immediate"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "HostsCoordinator"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HostsCoordinator"]

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
