name: Validate and deploy
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Select authentication
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_KEY=' >> "$GITHUB_ENV"
            echo 'CLOUDFLARE_EMAIL=' >> "$GITHUB_ENV"
          elif [ -z "$CLOUDFLARE_API_KEY" ] || [ -z "$CLOUDFLARE_EMAIL" ]; then
            echo 'Cloudflare credentials are missing'
            exit 1
          fi
      - run: node scripts/configure.mjs
      - run: pnpm run deploy
      - name: Preserve administrator credentials and synchronize application secrets
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
        run: node scripts/secrets.mjs
      - name: Verify actual deployment and refresh
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: node scripts/smoke.mjs
      - name: Verify custom domain DNS and TLS
        env:
          BASE_URL: https://hosts.violin47.dpdns.org
        run: node scripts/smoke.mjs
