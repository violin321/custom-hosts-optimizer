name: Hosts availability
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/smoke.mjs
      - name: Verify custom domain DNS and TLS
        env:
          BASE_URL: https://hosts.violin47.dpdns.org
        run: node scripts/smoke.mjs
